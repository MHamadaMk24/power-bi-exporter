# Daily report exports (skidata + pass)
load_detection:
  entry_wait_ms: 7500
  default_page_wait_ms: 15000
  page_waits:
    3: 60000
    4: 30000
    5: 22500
    7: 30000
  pre_screenshot_max_wait_ms: 60000
  min_wait_ms: 400
  settle_after_action_ms: 2000
  max_wait_ms: 90000
  network_idle_ms: 500
  poll_interval_ms: 400
  render_stable_reads: 2

output_dir: "output"

sharepoint:
  enabled: true
  upload_after_each: true

browser:
  headless: false
  slow_mo: 0
  viewport_width: 1920
  viewport_height: 1080

reports:
  - name: skidata
    label: SKIDATA report
    enabled: true
    report_url: "https://app.powerbi.com/view?r=eyJrIjoiYTBmYTY0MTgtMGQ2My00ODM1LTg5ZjQtZDc0Y2YxNzU0YWNkIiwidCI6IjIwNDcwZjE0LTBjZTgtNDkzZC05M2I1LTFhNjk2YWE0YmM0MCIsImMiOjl9"
    navigation:
      entry_button:
        path_width: "184.27586206896552"
        index: 0
      page_buttons:
        path_width: "51.994091580502214"
        forward_index: 0
        back_index: 1
        additional_pages: 6
    filters:
      slicer_label: "Location"
      export_combined: true
      export_all: true
      skip_values:
        - All
        - (Blank)

  - name: pass
    label: Pass report
    enabled: true
    report_url: "https://app.powerbi.com/view?r=eyJrIjoiNDJmMWVmZDctMGRhNS00MDk2LTg0ZjctZjdlZThjMmZkMGRiIiwidCI6IjIwNDcwZjE0LTBjZTgtNDkzZC05M2I1LTFhNjk2YWE0YmM0MCIsImMiOjl9"
    navigation:
      entry_button:
        path_width: "184.27586206896552"
        index: 0
      page_buttons:
        path_width: "37.51724137931034"
        forward_index: 0
        back_index: 1
        additional_pages: 2
    filters:
      slicer_label: "Location_Name"
      export_combined: true
      export_all: true
      skip_values:
        - All
        - (Blank)
